name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WEBLATE_LIVE_TESTS: "1"
      WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y bats jq
      - name: Run tests
        run: bats tests